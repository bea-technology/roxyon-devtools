name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance + OIDC trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # npm >= 11.5.1 is needed for OIDC "trusted publishing" (no NPM_TOKEN).
      # Configured per package at npmjs.com → package → Settings → Trusted
      # Publisher → GitHub Actions (bea-technology/roxyon-devtools, release.yml).
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      # With pending changesets: opens/updates the "chore: version packages" PR.
      # After that PR merges (no changesets on the merge commit): runs
      # `pnpm release` = build + `pnpm -r publish` (rewrites workspace:* deps,
      # skips already-published versions, exits 0 when there is nothing new).
      - name: Changesets
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          # No NODE_AUTH_TOKEN: publishing uses OIDC trusted publishing.

      # Keep the MCP registry in step with the published @roxyon/mcp version.
      # No-ops on every ordinary push (versions already match); only publishes
      # after a release bumped it. Manual re-run: Actions → "Publish to MCP Registry".
      - name: Update MCP registry
        run: |
          MCP_V=$(node -p "require('./packages/mcp-server/package.json').version")
          REG_V=$(curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=roxyon" \
            | node -p "JSON.parse(require('fs').readFileSync(0)).servers?.[0]?.server?.version || ''")
          if [ "$MCP_V" = "$REG_V" ]; then echo "registry already at $MCP_V — nothing to do"; exit 0; fi
          node -e "
            const f='integrations/mcp-registry/server.json';
            const j=require('./'+f);
            j.version='$MCP_V'; j.packages[0].version='$MCP_V';
            require('fs').writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
          "
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar -xz mcp-publisher
          chmod +x ./mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish ./integrations/mcp-registry/server.json
