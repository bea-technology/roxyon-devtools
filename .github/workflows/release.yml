name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance + OIDC trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # npm >= 11.5.1 is needed for OIDC "trusted publishing" (no NPM_TOKEN).
      # Configure it once per package at npmjs.com → package → Settings →
      # Trusted Publisher → GitHub Actions (repo bea-technology/roxyon-devtools,
      # workflow release.yml).
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      # Opens/updates a "Version Packages" PR from pending changesets; when that
      # PR is merged, this same job runs `pnpm release` and publishes.
      - name: Changesets
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          # Only needed if OIDC trusted publishing is NOT configured for a
          # package — add an NPM_TOKEN repo secret and it is picked up here.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  mcp-registry:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC → MCP registry (io.github.* namespace)
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Sync server.json version from @roxyon/mcp
        run: |
          V=$(node -p "require('./packages/mcp-server/package.json').version")
          node -e "
            const f='integrations/mcp-registry/server.json';
            const j=require('./'+f);
            j.version='$V'; j.packages[0].version='$V';
            require('fs').writeFileSync(f, JSON.stringify(j,null,2)+'\n');
          "
      - name: Publish to the MCP registry
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish integrations/mcp-registry/server.json
